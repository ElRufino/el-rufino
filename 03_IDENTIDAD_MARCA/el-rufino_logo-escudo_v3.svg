      <!-- granos superiores - pares alternados izq/der -->
      <ellipse
         cx="-8"
         cy="-70"
         rx="7"
         ry="4"
         transform="rotate(-30,-8,-70)"
         id="ellipse27" />
      <ellipse
         cx="8"
         cy="-60"
         rx="7"
         ry="4"
         transform="rotate(30,8,-60)"
         id="ellipse28" />
      <ellipse
         cx="-8"
         cy="-50"
         rx="7"
         ry="4"
         transform="rotate(-30,-8,-50)"
         id="ellipse29" />
      <ellipse
         cx="8"
         cy="-40"
         rx="7"
         ry="4"
         transform="rotate(30,8,-40)"
         id="ellipse30" />
      <ellipse
         cx="-8"
         cy="-30"
         rx="7"
         ry="4"
         transform="rotate(-30,-8,-30)"
         id="ellipse31" />
      <ellipse
         cx="8"
         cy="-20"
         rx="7"
         ry="4"
         transform="rotate(30,8,-20)"
         id="ellipse32" />
      <ellipse
         cx="-8"
         cy="-10"
         rx="7"
         ry="4"
         transform="rotate(-30,-8,-10)"
