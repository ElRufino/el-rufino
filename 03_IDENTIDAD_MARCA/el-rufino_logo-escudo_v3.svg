         offset="0%"
         stop-color="#1a1a1a"
         id="stop1" />
      <stop
         offset="100%"
         stop-color="#0d0d0d"
         id="stop2" />
    </radialGradient>
    <!-- Gradiente sol -->
    <radialGradient
       id="sunGrad"
       cx="50%"
       cy="60%"
       r="50%">
      <stop
         offset="0%"
         stop-color="#f5f0e8"
         id="stop3" />
      <stop
         offset="60%"
         stop-color="#f5f0e8"
         id="stop4" />
      <stop
