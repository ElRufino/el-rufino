async function callClaude(messages, system = "") {
  const body = { model: "claude-sonnet-4-20250514", max_tokens: 1000, messages };
  if (system) body.system = system;
  const res = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await res.json();
  return data.content?.map(b => b.text || "").join("") || "Sin respuesta";
}

function ModChatIA({ showToast }) {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [sys, setSys] = useState('Sos el asistente editorial de El Rufino, medio digital de Rufino, Santa Fe, Argentina (19.211 hab). Claim: "Lo que pasa y lo que significa". Pilares P01-P06. Regla madre: toda pieza tiene 2 capas (hecho verificado + significado). Voz: directa, verificada, local sin localista.');
  const endRef = useRef(null);
  useEffect(() => { endRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages]);
  const send = async () => {
    if (!input.trim() || loading) return;
    const userMsg = { role: "user", content: input };
    setMessages(prev => [...prev, userMsg]);
    setInput(""); setLoading(true);
    try {
      const reply = await callClaude([...messages, userMsg], sys);
      setMessages(prev => [...prev, { role: "assistant", content: reply }]);
    } catch { showToast("Error de conexión con Claude"); }
    finally { setLoading(false); }
  };
  return <div style={{ display: "flex", flexDirection: "column", height: "calc(100vh - 130px)" }}>
    <div style={{ fontSize: 9, color: P.rojo, letterSpacing: "3px", textTransform: "uppercase", fontWeight: 700, marginBottom: 4, fontFamily: "monospace" }}>CHAT IA · LIVE</div>
    <div style={{ fontSize: 22, color: P.negro, lineHeight: 1.1, marginBottom: 6 }}>Chat con Claude</div>
    <textarea value={sys} onChange={e => setSys(e.target.value)} style={{ width: "100%", padding: "7px 9px", border: `1px solid ${P.crema3}`, borderRadius: 4, fontSize: 9, fontFamily: "monospace", background: "#f8f7f4", outline: "none", resize: "none", height: 52, color: "#2d5a27", marginBottom: 8 }} />
    <div style={{ flex: 1, overflowY: "auto", background: "#fff", border: `1px solid ${P.crema3}`, borderRadius: 5, padding: 12, marginBottom: 8, minHeight: 100 }}>
      {messages.length === 0 && <div style={{ textAlign: "center", color: "#bbb", fontSize: 11, fontFamily: "monospace", paddingTop: 24 }}>Empezá la conversación ↓</div>}
      {messages.map((m, i) => (
        <div key={i} style={{ marginBottom: 10, display: "flex", justifyContent: m.role === "user" ? "flex-end" : "flex-start" }}>
          <div style={{ maxWidth: "82%", padding: "8px 12px", borderRadius: 7, fontSize: 11, lineHeight: 1.65, background: m.role === "user" ? P.rojo : "#f5f0e8", color: m.role === "user" ? "#fff" : P.negro, whiteSpace: "pre-wrap" }}>{m.content}</div>
        </div>
      ))}
      <AILoader loading={loading} label="Claude respondiendo..." />
      <div ref={endRef} />
    </div>
    <div style={{ display: "flex", gap: 7 }}>
      <textarea value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } }} placeholder="Escribí... (Enter envía, Shift+Enter nueva línea)" style={{ flex: 1, padding: "7px 9px", border: `1px solid ${P.crema3}`, borderRadius: 4, fontSize: 11, resize: "none", minHeight: 40, outline: "none" }} />
      <button onClick={send} disabled={loading} style={{ ...S.btn("p"), alignSelf: "flex-end", opacity: loading ? .5 : 1 }}>Enviar →</button>
    </div>
    {messages.length > 0 && <button onClick={() => setMessages([])} style={{ ...S.btn("g"), marginTop: 6, fontSize: 9 }}>Limpiar chat</button>}
  </div>;
}

    { name: "Reels (6B)", meta: "Marca editorial · 22–40 años", status: "gr", statusLabel: "HORIZONTE", kpi: "1", kpiLabel: "viral · 60 días" },

  return <div>
    <div style={{ fontSize: 9, color: P.rojo, letterSpacing: "3px", textTransform: "uppercase", fontWeight: 700, marginBottom: 4, fontFamily: "monospace" }}>REDES SOCIALES</div>

    {plataformas.map((pl, i) => (
      <div key={i} style={{ background: "#fff", border: `1px solid ${P.crema3}`, borderRadius: 5, padding: 11, display: "grid", gridTemplateColumns: "1fr auto", gap: 7, alignItems: "start", marginBottom: 5 }}>
        <div>
          <div style={{ fontSize: 12, color: P.negro, fontWeight: 700, marginBottom: 2 }}>{pl.name}</div>
          <div style={{ fontSize: 9, color: "#888", marginBottom: 5 }}>{pl.meta}</div>
          <span style={S.badge(pl.status)}>{pl.statusLabel}</span>

        <div style={{ textAlign: "right" }}>
          <div style={{ fontSize: 17, color: P.rojo, fontWeight: 900 }}>{pl.kpi}</div>
          <div style={{ fontSize: 8, color: "#aaa", fontFamily: "monospace" }}>{pl.kpiLabel}</div>
        </div>
      </div>
    ))}
    <Warn title="WhatsApp Canal — crítico">Sin él no hay distribución directa. Activar antes de publicar la primera nota.</Warn>

}

function ModContenido() {
  return <div>
    <div style={{ fontSize: 9, color: P.rojo, letterSpacing: "3px", textTransform: "uppercase", fontWeight: 700, marginBottom: 4, fontFamily: "monospace" }}>CONTENIDO EDITORIAL</div>
    <div style={{ fontSize: 22, color: P.negro, lineHeight: 1.1, marginBottom: 10 }}>Contenido Editorial</div>
    <SLabel>6 Pilares Editoriales</SLabel>
    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 7, marginBottom: 14 }}>
      {PILARES.map(p => (
        <div key={p.code} style={{ ...S.card, borderLeft: `3px solid ${p.color}` }}>
          <div style={{ fontSize: 9, fontFamily: "monospace", color: p.color, fontWeight: 700, marginBottom: 3 }}>{p.code}</div>

    </div>

        {[{ d: "LUN", p: "P01+P06" }, { d: "MAR", p: "P02" }, { d: "MIÉ", p: "P04" }, { d: "JUE", p: "P05" }, { d: "VIE", p: "P03" }, { d: "SÁB", p: "P04" }, { d: "DOM", p: "↓" }].map(({ d, p }) => (

    <Info title="Regla de las 2 capas — OBLIGATORIA">Capa 1: hecho verificado. Capa 2: qué significa / contexto / pregunta que queda abierta. Sin la segunda capa la pieza no se publica.</Info>

    { label: "Plugin v8.1.2", s: "g", txt: "activo" },
    { label: "WordPress / técnica", s: "y", txt: "configuración incompleta" },
    { label: "Imágenes institucionales", s: "g", txt: "logo + favicon + OG ✓" },

const MODULES = [
  { label: "Inicio", section: "BASE", badge: "v8" },
  { label: "Chat IA", section: "INTELIGENCIA", badge: "🔴 LIVE" },
  { label: "Redactor IA", section: "PRODUCCIÓN" },
  { label: "Kanban Editorial", section: "PRODUCCIÓN" },
  { label: "Compositor WA", section: "PRODUCCIÓN" },
  { label: "Contenido", section: "EDITORIAL" },
  { label: "Promesas", section: "SEGUIMIENTO" },
  { label: "Agentes IA", section: "INTELIGENCIA", badge: "12" },
  { label: "Contexto IA", section: "INTELIGENCIA" },
  { label: "Redes", section: "SEGUIMIENTO" },
  { label: "Roadmap", section: "BASE" },
];

function App() {
  const [cur, setCur] = useState(0);
  const [promesas, setPromesas] = useState([]);
  const [metrics, setMetrics] = useState({});
  const [toast, setToast] = useState("");
  const timerRef = useRef(null);
  const showToast = useCallback((msg) => {
    setToast(msg);
    clearTimeout(timerRef.current);
    timerRef.current = setTimeout(() => setToast(""), 2600);
  }, []);
  const sections = [...new Set(MODULES.map(m => m.section))];
  const renderModule = () => {
    switch (cur) {
      case 0: return <ModInicio promesas={promesas} metrics={metrics} onSetMetric={(k, v) => setMetrics(p => ({ ...p, [k]: v }))} />;
      case 1: return <ModChatIA showToast={showToast} />;
      case 2: return <ModRedactorIA showToast={showToast} />;
      case 3: return <ModKanban showToast={showToast} />;
      case 4: return <ModWhatsApp showToast={showToast} />;
      case 5: return <ModContenido />;
      case 6: return <ModPromesas promesas={promesas} onAdd={p => setPromesas(prev => [...prev, p])} onUpdateEstado={(id, e) => setPromesas(prev => prev.map(p => p.id === id ? { ...p, estado: e } : p))} onDelete={id => setPromesas(prev => prev.filter(p => p.id !== id))} showToast={showToast} />;
      case 7: return <ModAgentes showToast={showToast} />;
      case 8: return <ModContexto showToast={showToast} />;
      case 9: return <ModRedes />;
      case 10: return <ModRoadmap />;
      default: return null;
    }
  };
  return <div style={S.shell}>
    <div style={S.sidebar}>
      <div style={S.sbHead}>
        <div style={S.logoMark}>EL RUFINO</div>
        <div style={S.verTag}>
          <div style={{ width: 5, height: 5, borderRadius: "50%", background: "#43a047" }} />
          Plugin v8.1.2 · Panel IA
        </div>
      </div>
      <div style={S.sbNav}>
        {sections.map(section => (
          <div key={section}>
            <div style={S.ns}>{section}</div>
            {MODULES.map((m, i) => m.section === section && <NavItem key={i} label={m.label} active={cur === i} onClick={() => setCur(i)} badge={m.badge} />)}
          </div>
        ))}
      </div>
      <div style={{ padding: "9px 12px", borderTop: `1px solid ${P.crema3}`, display: "flex", flexDirection: "column", gap: 5 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 8, color: "#888", fontFamily: "monospace" }}>
          <div style={{ width: 5, height: 5, borderRadius: "50%", background: "#43a047", boxShadow: "0 0 5px #43a04760" }} />
          prueba.infoconectados.com
        </div>
        <div style={{ fontSize: 8, background: "#f5f0e8", color: "#888", border: `1px solid ${P.crema3}`, padding: "2px 6px", borderRadius: 3, fontFamily: "monospace", textAlign: "center" }}>FASE 2 EN EJECUCIÓN</div>
      </div>
    </div>
    <div style={S.main}>
      <div style={S.topbar}>
        <div style={{ fontSize: 8, color: "#888", fontFamily: "monospace", letterSpacing: 1, textTransform: "uppercase" }}>{MODULES[cur]?.section}</div>
        <div style={{ width: 1, height: 10, background: "#222", flexShrink: 0 }} />
        <div style={{ fontSize: 13, opacity: .75, flex: 1 }}>{MODULES[cur]?.label}</div>
        <div style={{ display: "flex", alignItems: "center", gap: 7 }}>
          <span style={{ fontSize: 8, color: "#888", fontFamily: "monospace" }}>{cur + 1}/{MODULES.length}</span>
          <div style={{ width: 70, height: 2, background: "#333", borderRadius: 1 }}>
            <div style={{ height: "100%", background: P.rojo, borderRadius: 1, width: `${(cur + 1) / MODULES.length * 100}%`, transition: "width .3s" }} />
          </div>
        </div>
        <div style={{ fontSize: 8, fontFamily: "monospace", color: "#aaa", padding: "2px 7px", border: "1px solid #444", borderRadius: 3 }}>prueba.infoconectados.com</div>
      </div>
      <div style={S.content}>{renderModule()}</div>
      <div style={S.navFt}>
        <button onClick={() => setCur(p => Math.max(0, p - 1))} disabled={cur === 0} style={{ fontSize: 10, padding: "6px 14px", borderRadius: 4, border: `1px solid ${P.crema3}`, background: "transparent", color: "#888", cursor: cur === 0 ? "default" : "pointer", opacity: cur === 0 ? .3 : 1, fontWeight: 700 }}>← Anterior</button>
        <span style={{ fontSize: 9, color: "#aaa", fontFamily: "monospace" }}>{cur + 1} de {MODULES.length}</span>
        <button onClick={() => setCur(p => Math.min(MODULES.length - 1, p + 1))} disabled={cur === MODULES.length - 1} style={{ fontSize: 10, padding: "6px 14px", borderRadius: 4, border: "none", background: P.rojo, color: "#fff", cursor: cur === MODULES.length - 1 ? "default" : "pointer", opacity: cur === MODULES.length - 1 ? .3 : 1, fontWeight: 700 }}>Siguiente →</button>
      </div>
    </div>
    <Toast msg={toast} />
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
